# ==============================================================================
# Nginx Reverse Proxy Configuration for SalesCRM Pro
# Domain: crm.automationcafe.in
# Architecture: Single Domain (Frontend + Backend + WebSockets unified)
# Path on server: /etc/nginx/sites-available/crm.automationcafe.in
# ==============================================================================

# Upstream definitions
upstream crm_frontend_upstream {
    server 127.0.0.1:3025;
    keepalive 32;
}

upstream crm_backend_upstream {
    server 127.0.0.1:5010;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# HTTP (Port 80) - Redirect all traffic to HTTPS (Port 443)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name crm.automationcafe.in;

    # Let's Encrypt ACME challenge location for SSL issuance & renewal
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# HTTPS (Port 443) - Unified Frontend, Backend API & WebSockets
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name crm.automationcafe.in;

    # SSL Certificates (managed automatically by Certbot)
    ssl_certificate /etc/letsencrypt/live/crm.automationcafe.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.automationcafe.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security & Privacy Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Maximum upload size for Excel/CSV bulk lead import & file uploads
    client_max_body_size 50M;

    # Gzip compression for high performance
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # --------------------------------------------------------------------------
    # 1. Backend REST API (/api/) -> Reverse Proxy to Port 5010
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://crm_backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # --------------------------------------------------------------------------
    # 2. Backend Health Check (/health)
    # --------------------------------------------------------------------------
    location /health {
        proxy_pass http://crm_backend_upstream/health;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # 3. Socket.IO / WebSockets (/socket.io/) -> Real-time Agent Notifications
    # --------------------------------------------------------------------------
    location /socket.io/ {
        proxy_pass http://crm_backend_upstream/socket.io/;
        proxy_http_version 1.1;

        # WebSocket upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep persistent connection open
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --------------------------------------------------------------------------
    # 4. Next.js Static Assets Caching (/_next/static/)
    # --------------------------------------------------------------------------
    location /_next/static/ {
        proxy_pass http://crm_frontend_upstream/_next/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --------------------------------------------------------------------------
    # 5. Frontend Next.js Web Application (/) -> Reverse Proxy to Port 3025
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://crm_frontend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}

